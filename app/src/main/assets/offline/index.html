<!DOCTYPE html>
<html>
<head>
  <title>Full-page Image View</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    .image-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>
  <div class="image-container" style="background-image: url('mybg.jpg');"></div>
</body>
</html>
