<!DOCTYPE html>
<html>
<head>
  <title>Full-page Image Slider</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    .slider {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .slider img.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="slider">
    <img src="img1.png" class="active">
    <img src="img2.png">
    <img src="img3.png">
    <img src="img4.png">
    <img src="img5.png">
    <!-- Add more images as needed -->
  </div>

  <script>
    var images = document.querySelectorAll('.slider img');
    var currentImage = 0;

    setInterval(function() {
      images[currentImage].classList.remove('active');
      currentImage = (currentImage + 1) % images.length;
      images[currentImage].classList.add('active');
    }, 3000);
  </script>
</body>
</html>
