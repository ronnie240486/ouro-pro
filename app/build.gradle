plugins {
    id 'com.android.application'
}

apply plugin: 'realm-android'

android {
    namespace 'com.ouropro.player'
    // BUG corrigido: estava compileSdk 35 / targetSdk 34. A partir de
    // 2025 a Google Play passou a exigir targetSdk >= 36 (Android 16) pra
    // publicar/atualizar qualquer app novo -- o Play Console recusa o
    // upload do .aab com o erro "esse nível precisa ser de pelo menos 36"
    // enquanto isso não for corrigido. compileSdk precisa ser >= targetSdk,
    // por isso os dois sobem juntos.
    compileSdk 36

    // BUG corrigido: não existia esse bloco -- o Gradle usava a assinatura
    // "debug" padrão dele mesmo, que quando não existe ~/.android/debug.keystore
    // na máquina, ele MESMO gera uma nova aleatória na hora. O GitHub Actions
    // roda cada build numa máquina virtual nova/vazia, então TODO build saía
    // com uma assinatura diferente do build anterior. O Android trata "mesmo
    // pacote (com.ouropro.player.debug), assinatura diferente" como um
    // possível app malicioso se passando pelo original, e recusa a instalação
    // por cima com "Aplicativo não instalado" -- exatamente o erro relatado.
    // Com uma keystore fixa versionada aqui no repositório, todo APK debug sai
    // com a MESMA assinatura pra sempre, então instalar a versão nova por
    // cima da antiga volta a funcionar.
    //
    // IMPORTANTE pra quem já tem o app instalado num TV box: como as versões
    // antigas foram assinadas com chaves aleatórias diferentes entre si, a
    // primeira instalação depois dessa correção ainda vai precisar desinstalar
    // a versão atual manualmente uma última vez. Depois disso, toda atualização
    // futura instala por cima sem precisar desinstalar de novo.
    signingConfigs {
        debug {
            storeFile file('ouropro-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Assinatura de release pra Play Store. A keystore de verdade NUNCA
        // fica commitada aqui (o .gitignore já bloqueia *.keystore/*.jks) --
        // ela só existe: (1) no GitHub Actions, decodificada em tempo de
        // build a partir do secret KEYSTORE_BASE64 (ver
        // .github/workflows/build-apk.yml, job build-release-aab), ou (2)
        // na sua própria máquina, se você exportar as mesmas variáveis de
        // ambiente antes de rodar `./gradlew :app:bundleRelease` localmente.
        // Sem essas variáveis definidas, essa keystore fica com valores
        // vazios/nulos e só dá erro se alguém tentar rodar bundleRelease
        // sem configurá-las -- não afeta o build de debug de jeito nenhum.
        release {
            storeFile file(System.getenv('OUROPRO_RELEASE_KEYSTORE_PATH') ?: (project.findProperty('OUROPRO_RELEASE_KEYSTORE_PATH') ?: 'ouropro-release.keystore'))
            storePassword System.getenv('OUROPRO_RELEASE_STORE_PASSWORD') ?: project.findProperty('OUROPRO_RELEASE_STORE_PASSWORD')
            keyAlias System.getenv('OUROPRO_RELEASE_KEY_ALIAS') ?: (project.findProperty('OUROPRO_RELEASE_KEY_ALIAS') ?: 'ouropro')
            keyPassword System.getenv('OUROPRO_RELEASE_KEY_PASSWORD') ?: project.findProperty('OUROPRO_RELEASE_KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId 'com.ouropro.player'
        minSdk 21
        targetSdk 36
        versionCode 243
        versionName '6.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        multiDexEnabled true
        // BUG corrigido: essa suposição ("praticamente todo TV box é
        // arm64-v8a") não é verdade -- confirmado com o erro real "Este
        // aplicativo não é compatível com seu smartphone" numa TV box MXQ
        // Pro 4K, que é EXATAMENTE a mensagem que o instalador do Android
        // mostra quando o APK só tem bibliotecas nativas (ExoPlayer, Realm,
        // gif-drawable etc.) pra uma arquitetura de processador que o
        // aparelho não tem. Muita TV box "barata" (inclusive boa parte das
        // MXQ Pro) usa chip ARM de 32 bits (armeabi-v7a), não 64 bits
        // (arm64-v8a) -- por isso incluir os dois aqui. Deixa o APK um pouco
        // maior (duas cópias das bibliotecas nativas), mas sem isso o app
        // simplesmente não instala nesses aparelhos, então não tem meio-termo.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            buildConfigField 'boolean', 'ENABLE_VERBOSE_NETWORK_LOGS', 'false'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'boolean', 'ENABLE_VERBOSE_NETWORK_LOGS', 'false'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', '/META-INF/NOTICE.md', '/META-INF/LICENSE.md']
        }
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

realm {
    syncEnabled = false
}

dependencies {
    compileOnly files('libs/org.apache.http.legacy.jar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.19.1'
    implementation 'com.google.android.exoplayer:extension-cronet:2.19.1'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.android.volley:volley:1.2.1'

    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.29'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'org.androidannotations:androidannotations-api:4.8.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    implementation 'com.google.android.play:review:2.0.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}
