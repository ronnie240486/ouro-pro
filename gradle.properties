org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableJetifier=true
# Rede de segurança: o AGP 8.6.1 deste projeto é anterior ao lançamento
# oficial do Android 16 (API 36) e pode reclamar "compileSdk 36 não
# testado com essa versão do AGP" (é só aviso, mas em algumas versões do
# AGP isso pode falhar o build). Essa flag garante que o build continue
# mesmo assim -- foi preciso subir compileSdk/targetSdk pra 36 porque a
# Google Play passou a exigir targetSdk >= 36 pra publicar.
android.suppressUnsupportedCompileSdk=36
