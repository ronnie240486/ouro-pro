name: Build APK (direto no Actions)

# Builda o OuroPro direto aqui no GitHub Actions a cada push que muda o
# app ou o próprio workflow, sem precisar de nenhuma ferramenta externa.
# É um projeto Android nativo (Java + Gradle), então não tem passo de
# "prebuild" nenhum — só configura o JDK/SDK e roda o Gradle, igual
# qualquer projeto Android comum.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # "contents: write" é necessário pro passo de Release lá embaixo poder
    # publicar/atualizar o release e o link fixo de download do APK.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Android SDK (instalação manual, sem depender de action de terceiro)
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Rodar os testes unitários
        run: ./gradlew test --no-daemon --stacktrace

      - name: Buildar o APK (debug, sem assinatura de produção)
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Encontrar o APK gerado
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Encontrado: $APK_PATH"

      - name: Enviar o APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: ouropro-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publicar o APK num link fixo (GitHub Release), pra colar no painel/Downloader
        # O link do artefato acima muda a cada build e exige estar logado no
        # GitHub — não dá pra colar num player de TV box nem no campo de
        # download do painel. Um "GitHub Release" com nome de tag e de
        # arquivo sempre iguais gera um link público fixo: o arquivo por
        # trás dele é substituído a cada build, mas a URL nunca muda.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.path }}" ouropro-debug.apk
          gh release create ouropro-latest ouropro-debug.apk \
            --repo "${{ github.repository }}" \
            --title "OuroPro — build automático mais recente" \
            --notes "Gerado automaticamente pelo GitHub Actions a cada push em main. Este link não muda — sempre aponta pro build mais recente." \
          || gh release upload ouropro-latest ouropro-debug.apk \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Mostrar o link fixo de download
        run: |
          echo "Link fixo do APK (cole no painel ou no Downloader):"
          echo "https://github.com/${{ github.repository }}/releases/download/ouropro-latest/ouropro-debug.apk"

  # Build separado, só pra gerar o .aab assinado que a Play Store exige.
  # Só roda se os 3 secrets de assinatura já estiverem cadastrados no repo
  # (Settings -> Secrets and variables -> Actions) -- antes disso, esse job
  # fica marcado como "pulado" (não como erro) em toda run.
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # BUG corrigido: o GitHub NÃO deixa usar o contexto "secrets" dentro de
    # "if:" no nível do JOB (só dentro de "if:" de cada STEP) -- usar assim
    # não pula o job, invalida o arquivo do workflow inteiro, com o erro
    # "Unrecognized named-value: 'secrets'" (foi exatamente o que aconteceu
    # nas primeiras runs). A correção: calcula um env var booleano aqui
    # (env: no nível do job aceita "secrets" numa boa) e usa esse env var
    # -- não mais "secrets" diretamente -- no "if:" de CADA step abaixo.
    # Sem os 3 secrets cadastrados, todo step deste job aparece como
    # "Skipped", sem quebrar a run.
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SIGNING_SECRETS == 'true'

      - name: Setup JDK 17
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Android SDK (instalação manual, sem depender de action de terceiro)
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Cache do Gradle
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decodificar a keystore de release (nunca fica salva no repositório)
        if: env.HAS_SIGNING_SECRETS == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/ouropro-release.keystore

      - name: Buildar o .aab assinado (formato exigido pela Play Store)
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          OUROPRO_RELEASE_KEYSTORE_PATH: ouropro-release.keystore
          OUROPRO_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OUROPRO_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OUROPRO_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Apagar a keystore decodificada (não deixa sobrar no runner)
        if: always()
        run: rm -f app/ouropro-release.keystore

      - name: Encontrar o .aab gerado
        if: env.HAS_SIGNING_SECRETS == 'true'
        id: aab
        run: |
          AAB_PATH=$(find app/build/outputs/bundle -name "*.aab" | head -n1)
          echo "path=$AAB_PATH" >> "$GITHUB_OUTPUT"
          echo "Encontrado: $AAB_PATH"

      - name: Enviar o .aab como artefato do build (baixe aqui pra subir na Play Console)
        if: env.HAS_SIGNING_SECRETS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ouropro-release-aab
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
